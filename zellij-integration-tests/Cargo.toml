[package]
name = "zellij-integration-tests"
description = "In-process whole-app integration test harness for Zellij"
publish = false
license.workspace = true
repository.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
zellij-client = { workspace = true, features = ["web_server_capability"] }
zellij-server = { workspace = true, features = ["web_server_capability"] }
zellij-utils = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
interprocess = { workspace = true }
insta = "1.48"
log = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
vte = { workspace = true }

[dev-dependencies]
zellij-relay-server = { path = "../zellij-relay-server" }
zellij-relay-client = { workspace = true, features = ["tunnel"] }
zellij-relay-protocol = { workspace = true }
zellij-browser-bridge = { workspace = true }
axum = { version = "0.8.4", features = ["ws"] }
futures-util = "0.3"
serial_test = "3.0"
tempfile = { workspace = true }
uuid = { workspace = true }
